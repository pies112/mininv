name: Build v3 notebook

on:
  push:
    paths:
      - build_v3_patcher.py
      - .github/workflows/build-v3-notebook.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook tools
        run: python -m pip install --upgrade pip nbformat

      - name: Repair generator delimiters
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('build_v3_patcher.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("PATCHER_CODE = r'''", 'PATCHER_CODE = r"""', 1)
          marker = "'''\n\nMARKDOWN = r'''"
          pos = text.rfind(marker)
          if pos < 0:
              raise RuntimeError('Не найден завершающий маркер PATCHER_CODE')
          text = text[:pos] + '"""\n\nMARKDOWN = r\'\'\'' + text[pos + len(marker):]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build notebook
        run: python build_v3_patcher.py

      - name: Validate notebook JSON and code syntax
        run: |
          python - <<'PY'
          import nbformat
          path = '3_Инженерный_рейтинг_2026_единая_патентная_выгрузка.ipynb'
          nb = nbformat.read(path, as_version=4)
          for index, cell in enumerate(nb.cells):
              if cell.cell_type == 'code' and cell.source.strip():
                  compile(cell.source, f'cell_{index + 1}', 'exec')
          print(f'Validated {len(nb.cells)} cells')
          PY

      - name: Commit generated notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '3_Инженерный_рейтинг_2026_единая_патентная_выгрузка.ipynb'
          if ! git diff --cached --quiet; then
            git commit -m 'Build v3 patent notebook [skip ci]'
            git push
          fi
