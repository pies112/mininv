name: Copy v3 notebook to ASCII path

on:
  push:
    paths:
      - .github/workflows/copy-v3-ascii.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy notebook
        run: cp '3_Инженерный_рейтинг_2026_единая_патентная_выгрузка.ipynb' v3_notebook.ipynb
      - name: Commit copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3_notebook.ipynb
          git commit -m 'Add ASCII copy of v3 notebook [skip ci]'
          git push
