name: package-patent-notebook

on:
  pull_request:
    paths:
      - 'artifacts/4_Финальная_обработка_патентной_базы.ipynb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/4_Финальная_обработка_патентной_базы.ipynb')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('nbformat') == 4
          assert data.get('cells')
          print(path, 'OK', path.stat().st_size)
          PY
      - name: Upload notebook
        uses: actions/upload-artifact@v4
        with:
          name: 4_Финальная_обработка_патентной_базы
          path: artifacts/4_Финальная_обработка_патентной_базы.ipynb
          if-no-files-found: error
          retention-days: 7
