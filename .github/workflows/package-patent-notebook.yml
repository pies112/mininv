name: package-patent-notebook

on:
  pull_request:
    paths:
      - 'artifacts/4_Финальная_обработка_патентной_базы.ipynb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show notebook
        run: ls -lh artifacts/4_Финальная_обработка_патентной_базы.ipynb
      - name: Upload notebook
        uses: actions/upload-artifact@v4
        with:
          name: 4_Финальная_обработка_патентной_базы
          path: artifacts/4_Финальная_обработка_патентной_базы.ipynb
          if-no-files-found: error
          retention-days: 7
